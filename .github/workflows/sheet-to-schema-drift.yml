name: sheet-to-schema drift

# Dynamic Entity's import engine is sheet-to-schema, published from its own repository
# (github.com/berserker5619/sheet-to-schema). Core, server and ngx-dynamic-entity (from 3.1) depend on it, pinned exactly during release
# candidates, so nothing here moves when it publishes. This job is how Dynamic Entity finds out,
# within a day, that a newly published sheet-to-schema would break it: before a user does, and
# before the pin is raised.
#
# Two jobs, each resolving a version, installing it in place of the declared range (and proving
# it is the only copy), building, then running the Phase 2 parity gate and the import suites:
#
# - in-range (blocking): the newest sheet-to-schema that satisfies the range core, server and
#   ngx-dynamic-entity declare, which is what a user installing Dynamic Entity 3.x gets. Red here
#   means a 3.x user is broken today.
# - latest (non-blocking, continue-on-error): sheet-to-schema@latest, an early warning for
#   Dynamic Entity 4.0. Once sheet-to-schema 2.0.0 is latest it is outside 3.x's range, and this
#   job failing is expected until 4.0 adopts it; it never fails the run.
#
# A failure names the version and what was resolved.

on:
  schedule:
    - cron: '17 4 * * *' # daily, off the hour
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheet-to-schema-drift
  cancel-in-progress: false

env:
  CI: true
  FORCE_COLOR: 0

jobs:
  drift:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ !matrix.blocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sheet-to-schema in Dynamic Entity's declared range (blocking)
            resolve: in-range
            blocking: true
          - name: 'sheet-to-schema@latest: early warning for Dynamic Entity 4.0 (non-blocking)'
            resolve: latest
            blocking: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve sheet-to-schema (${{ matrix.resolve }})
        id: resolve
        run: |
          RANGE=$(node scripts/drift-resolve.mjs range)
          if [ "${{ matrix.resolve }}" = "in-range" ]; then SPEC="$RANGE"; else SPEC="${{ matrix.resolve }}"; fi
          VERSION=$(npm view "sheet-to-schema@$SPEC" version --json | node scripts/drift-resolve.mjs newest)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
          echo "sheet-to-schema@$SPEC is $VERSION; Dynamic Entity declares $RANGE."
          {
            echo "### sheet-to-schema@$SPEC = \`$VERSION\`"
            echo "Dynamic Entity declares \`$RANGE\` in core, server and ngx-dynamic-entity."
            if [ "${{ matrix.blocking }}" != "true" ]; then
              echo "Non-blocking: an early warning for Dynamic Entity 4.0."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Every workspace that depends on it is moved, not just the root: a root-level install
      # would leave core, server and ngx-dynamic-entity resolving their own pinned copy beside it, and this job
      # would test the declared range while reporting the new version.
      - name: Install sheet-to-schema@${{ steps.resolve.outputs.version }} in place of the declared range
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          for WS in packages/core packages/server packages/ngx-dynamic-entity; do
            npm pkg set "dependencies.sheet-to-schema=$VERSION" --workspace "$WS"
          done
          npm install --no-audit --no-fund
          node -e "
            const fs = require('fs');
            const want = process.env.VERSION;
            const root = require('./node_modules/sheet-to-schema/package.json').version;
            const nested = fs.readdirSync('packages').filter(p => fs.existsSync('packages/' + p + '/node_modules/sheet-to-schema'));
            if (root !== want || nested.length) {
              console.error('Expected one copy of sheet-to-schema@' + want + '; root has ' + root + (nested.length ? ', nested under ' + nested.join(', ') : ''));
              process.exit(1);
            }
            console.log('One copy of sheet-to-schema, at ' + root + '.');
          "
          npm ls sheet-to-schema

      - name: Build
        run: npm run build

      - name: Phase 2 parity gate
        run: npm run check:parity

      - name: Import suites (core, server)
        run: npx turbo run test --filter=@dynamic-entity/core --filter=@dynamic-entity/server

      - name: Import suites (ngx-dynamic-entity)
        working-directory: packages/ngx-dynamic-entity
        run: npx jest src/lib/import

      - name: Name the version that broke
        if: failure()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          MESSAGE="Dynamic Entity fails against sheet-to-schema@${VERSION:-unresolved} (resolved from ${{ steps.resolve.outputs.spec || matrix.resolve }})."
          if [ "${{ matrix.blocking }}" != "true" ]; then MESSAGE="$MESSAGE Early warning for 4.0; not blocking."; fi
          if [ "${{ matrix.blocking }}" = "true" ]; then
            echo "::error title=sheet-to-schema drift::$MESSAGE"
          else
            echo "::warning title=sheet-to-schema early warning::$MESSAGE"
          fi
          {
            echo ""
            echo "## :x: $MESSAGE"
            echo "The failing step above is where it broke. Reproduce locally with:"
            echo '```'
            echo "npm pkg set dependencies.sheet-to-schema=${VERSION} --workspace packages/core --workspace packages/server --workspace packages/ngx-dynamic-entity && npm install"
            echo '```'
            if [ "${{ matrix.blocking }}" = "true" ]; then
              echo "Fix it in sheet-to-schema's 1.x line first: a user installing Dynamic Entity today gets this version."
            else
              echo "Expected while sheet-to-schema@latest is a major Dynamic Entity does not declare yet; 4.0's work list."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
