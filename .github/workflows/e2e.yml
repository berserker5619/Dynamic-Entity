name: E2E

# The whole suite runs on every pull request.
#
# It used to run a hand-picked subset per PR with the full set left to a nightly job, on the
# stated grounds that the suite "takes over three hours". That figure was wrong — carried
# over from a misread review note. The first nightly run measured it:
#
#   Running 72 tests using 1 worker
#   71 passed (3.6m)
#
# Three and a half minutes does not justify splitting the signal, so there is one command and
# every pull request gets the whole thing. The nightly stays: it catches flakiness that a
# single run per change cannot, and drift in anything the browser depends on. (The suite has
# since grown to 266 tests in about 8.5 minutes, which still does not justify a split.)
#
# CI compares screenshots against the *-linux.png baselines only. Run this workflow by hand
# with update_snapshots ticked to regenerate them: it runs just the visual suite with
# --update-snapshots=all and uploads the Linux set as an artifact. "all", not "changed": the
# tests allow a 5% pixel difference, so "changed" leaves alone a baseline that has drifted
# by less than that, which is how a stale layout survives. Linux baselines then never have
# to be made on Windows or in a hand-built Docker container. Look at every image before
# committing it, side by side with its *-win32.png twin.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the Linux visual baselines and upload them as an artifact'
        type: boolean
        default: false

concurrency:
  # A regeneration run gets a group of its own, so a push to main does not cancel it.
  group: e2e-${{ github.workflow }}-${{ github.ref }}${{ inputs.update_snapshots && '-snapshots' || '' }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # Generous against a ~4 minute suite, so a genuine hang is still cut off rather than
    # occupying a runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: packages/demo-angular

      # test-data-json-rendering is the one worth knowing about: it asserts every field type
      # in the reference dataset exists in the catalog, fails on any [ngx-dynamic-entity]
      # console warning, and requires tabs that declare fields to actually render controls. It
      # previously watched only for uncaught exceptions and so passed green over three field
      # types the renderer refused to draw.
      - name: E2E
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test
        working-directory: packages/demo-angular

      - name: Regenerate Linux visual baselines
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test e2e/visual-regression.spec.ts --update-snapshots=all
        working-directory: packages/demo-angular

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update_snapshots }}
        with:
          name: linux-snapshots-${{ github.run_id }}
          path: packages/demo-angular/e2e/visual-regression.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            packages/demo-angular/playwright-report/
            packages/demo-angular/test-results/
          retention-days: 7
