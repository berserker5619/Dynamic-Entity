# Dependabot was off entirely until now, and there was no update config — so nothing
# watched the dependency surface at all, while SECURITY.md published a disclosure process.
#
# Context for whoever tunes this: all three published packages declare no `dependencies`,
# only peers and devDeps, so nothing Dependabot finds here ships to a consumer. Everything
# below is build-toolchain hygiene. That is a reason to keep the noise low, not a reason to
# skip it — the point is that a fault in something that *does* ship would now be seen.

version: 2

updates:
  - package-ecosystem: npm
    # One entry covers the workspace: npm workspaces share the root lockfile, so Dependabot
    # resolves every package from here. Separate entries per package would collide on it.
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      # Angular ships its packages in lockstep and they must move together — a partial bump
      # does not install. One PR per release, not fifteen.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@nguniversal/*'
          - ng-packagr
          - zone.js
      # @typescript-eslint ships parser and plugin as a matched pair — bumping one alone is
      # an ERESOLVE, which is exactly how the first run failed.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
      # Everything else, batched by risk. Minor and patch are the ones worth taking on sight.
      dev-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # No majors in the toolchain. Each of these breaks something that a group cannot
      # repair on its own.
      #
      # Angular was briefly exempted here, on the reasoning that the group would keep its
      # packages together. The first run disproved it: instead of one Angular 22 PR it
      # produced four, three of which did not install at all — @angular/compiler@22 against
      # compiler-cli@21, platform-browser@22 against forms@21, material@22 against cdk@21.
      # Angular's packages move in lockstep, and a partial bump has no resolution, so the
      # major has to be one deliberate commit across the whole stack the way 21 was
      # (c3b9480) rather than something Dependabot proposes piecemeal.
      #
      # ng-packagr and jest-preset-angular track the Angular major and belong with it.
      # TypeScript 6/7 drops `baseUrl`; @typescript-eslint 8 does not install against
      # eslint-plugin 7.
      #
      # Minors and patches still flow through the groups above, which is where the security
      # fixes are. Security alerts are never suppressed by an ignore rule.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-preset-angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'zone.js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@typescript-eslint/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  # The CI runner already warns that actions/checkout@v4 and actions/setup-node@v4 are
  # pinned to a deprecated Node. Nothing was watching for that either.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - '*'
